<!doctype html>
<meta charset="utf-8">
<title>瀏覽器</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #f3ead3; font-family: "Segoe UI", "PingFang TC", sans-serif; overflow: hidden; }
  #card { box-sizing: border-box; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #1c1814; border: 1px solid rgba(212, 175, 106, .75); position: relative; display: flex; flex-direction: column; }
  body:not(.open) #card { cursor: grab; }
  #hit { all: unset; box-sizing: border-box; display: block; width: 100%; height: 100%; cursor: inherit; position: relative; }
  img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; background: #1c1814; }
  .cap { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .name { background: rgba(28, 24, 20, .86); border-radius: 999px; padding: 3px 8px; font-size: 12px; }
  .bar { display: none; flex-direction: column; background: #1c1814; flex: none; cursor: grab; user-select: none; }
  body.open #hit, body.open img, body.open .cap { display: none; }
  body.open .bar, body.open .edges { display: flex; }
  body.dragging #card { position: absolute; }
  body.dragging .bar { cursor: grabbing; }
  .tools { height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 8px; flex: none; }
  .engines { height: 36px; display: none; align-items: center; gap: 4px; padding: 0 8px; overflow-x: auto; flex: none; }
  body.open .engines { display: flex; }
  .engines.warn { background: #3a2a16; }
  .englab { font-size: 11px; opacity: .85; flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .engines button.on { background: #c4a574; color: #1c1814; }
  .tabs { height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 8px; overflow-x: auto; flex: none; }
  .tabs[hidden] { display: none; }
  .tab { display: flex; align-items: center; gap: 2px; border: 1px solid #c4a574; border-radius: 999px; padding: 2px 4px 2px 8px; max-width: 160px; }
  .tab.on { background: #c4a574; color: #1c1814; }
  .tab button, .tool, .back { all: unset; box-sizing: border-box; cursor: pointer; font-size: 12px; color: inherit; white-space: nowrap; }
  .tool, .back { border: 1px solid #c4a574; border-radius: 999px; padding: 4px 10px; color: #e7d3a1; }
  .tab .label { overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
  .tab .x { width: 18px; height: 18px; border-radius: 999px; text-align: center; line-height: 18px; }
  .tool:disabled { opacity: .35; cursor: default; }
  .edges { display: none; }
  .edge { position: absolute; z-index: 3; }
  .edge.n { top: 0; left: 14px; right: 14px; height: 8px; cursor: ns-resize; }
  .edge.s { bottom: 0; left: 14px; right: 14px; height: 8px; cursor: ns-resize; }
  .edge.w { left: 0; top: 14px; bottom: 14px; width: 8px; cursor: ew-resize; }
  .edge.e { right: 0; top: 14px; bottom: 14px; width: 8px; cursor: ew-resize; }
  .edge.nw { left: 0; top: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  .edge.ne { right: 0; top: 0; width: 14px; height: 14px; cursor: nesw-resize; }
  .edge.sw { left: 0; bottom: 0; width: 14px; height: 14px; cursor: nesw-resize; }
  .edge.se { right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; }
  form { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; }
  input { flex: 1; min-width: 0; height: 28px; border-radius: 999px; border: 1px solid rgba(196, 165, 116, .7); background: #12100d; color: #f3ead3; padding: 0 10px; font: inherit; font-size: 12px; }
  .back { flex: none; }
</style>
<body>
  <div id="card">
    <button id="hit" type="button" aria-label="打開瀏覽器">
      <img id="pic" alt="">
      <span class="cap"><span class="name" id="name">瀏覽器</span><span class="name">拖動</span></span>
    </button>
    <div class="bar" id="bar">
      <div class="tabs" id="tabs" hidden></div>
      <div class="tools">
        <button type="button" class="tool" id="goBack">返回上一頁</button>
        <button type="button" class="tool" id="newTab">開啟新分頁</button>
        <form id="go">
          <input id="url" placeholder="https://" autocomplete="off" spellcheck="false" aria-label="網址">
          <button type="submit" class="tool">編輯</button>
        </form>
        <button type="button" class="back" id="collapse">收回</button>
      </div>
      <div class="engines" id="engines">
        <span class="englab" id="englab">OCTA 的瀏覽器</span>
        <button type="button" class="tool" data-engine="chrome">Chrome</button>
        <button type="button" class="tool" data-engine="brave">Brave</button>
        <button type="button" class="tool" data-engine="firefox">Firefox</button>
        <button type="button" class="tool" data-engine="edge">Edge</button>
      </div>
    </div>
    <div class="edges" id="edges">
      <div class="edge n" data-edge="n"></div>
      <div class="edge s" data-edge="s"></div>
      <div class="edge w" data-edge="w"></div>
      <div class="edge e" data-edge="e"></div>
      <div class="edge nw" data-edge="nw"></div>
      <div class="edge ne" data-edge="ne"></div>
      <div class="edge sw" data-edge="sw"></div>
      <div class="edge se" data-edge="se"></div>
    </div>
  </div>
  <script>
    const hit = document.getElementById('hit');
    const card = document.getElementById('card');
    const pic = document.getElementById('pic');
    const name = document.getElementById('name');
    const api = () => window.octaBrowser;
    let down = null;
    function place(d) {
      if (!d || !d.dragging) {
        document.body.classList.remove('dragging');
        card.style.left = card.style.top = card.style.width = card.style.height = '';
        return;
      }
      document.body.classList.add('dragging');
      card.style.left = d.x + 'px';
      card.style.top = d.y + 'px';
      card.style.width = d.w + 'px';
      card.style.height = d.h + 'px';
    }
    function endDrag(moved, fromThumb) {
      down = null;
      if (moved) api()?.dragEnd();
      else if (fromThumb) api()?.toggle();
    }
    function track(el, edge) {
      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        if (!edge && (document.body.classList.contains('open') ? e.target.closest('button, input, a') : false)) return;
        if (!edge && document.body.classList.contains('open') === false && el !== hit) return;
        if (edge && !document.body.classList.contains('open')) return;
        if (!edge && el === hit && document.body.classList.contains('open')) return;
        down = { sx: e.screenX, sy: e.screenY, moved: false, pid: e.pointerId, edge: edge || '' };
        try { el.setPointerCapture(e.pointerId); } catch { }
        e.preventDefault();
      });
      el.addEventListener('pointermove', e => {
        if (!down || e.pointerId !== down.pid) return;
        const dx = e.screenX - down.sx, dy = e.screenY - down.sy;
        if (!down.moved) {
          if (Math.hypot(dx, dy) < 4) return;
          down.moved = true;
          const box = api()?.dragStart();
          place(box ? { dragging: true, ...box } : null);
          if (!box) { down = null; return; }
        }
        down.sx = e.screenX;
        down.sy = e.screenY;
        api()?.dragBy(dx, dy, down.edge);
      });
      el.addEventListener('pointerup', e => {
        if (!down || e.pointerId !== down.pid) return;
        const moved = down.moved;
        try { el.releasePointerCapture(e.pointerId); } catch { }
        endDrag(moved, el === hit);
      });
      el.addEventListener('pointercancel', () => { if (down) endDrag(down.moved, false); });
    }
    track(hit, '');
    track(document.getElementById('bar'), '');
    document.querySelectorAll('.edge').forEach(el => track(el, el.dataset.edge));
    window.addEventListener('blur', () => { if (down?.moved) endDrag(true, false); else down = null; });
    document.getElementById('goBack').onclick = () => api()?.back();
    document.getElementById('newTab').onclick = () => api()?.newTab();
    document.getElementById('collapse').onclick = () => api()?.toggle();
    document.getElementById('go').onsubmit = e => { e.preventDefault(); api()?.go(document.getElementById('url').value); };
    document.getElementById('engines').onclick = e => {
      const b = e.target.closest('[data-engine]');
      if (b) api()?.engine(b.dataset.engine);
    };
    function paintEngines(d) {
      const row = document.getElementById('engines');
      const lab = document.getElementById('englab');
      row.classList.toggle('warn', !!d.blocked);
      lab.textContent = d.downloading ? ('下載中 ' + (d.percent || 0) + '%') : (d.error || (d.blocked ? '這個網站不支援現在的瀏覽器' : 'OCTA 的瀏覽器'));
      const list = Array.isArray(d.engines) ? d.engines : [];
      for (const e of list) {
        const b = row.querySelector('[data-engine="' + e.id + '"]');
        if (b) b.classList.toggle('on', !!e.on);
      }
    }
    document.getElementById('tabs').onclick = e => {
      const x = e.target.closest('[data-close]');
      if (x) { api()?.closeTab(+x.dataset.close); return; }
      const b = e.target.closest('[data-tab]');
      if (b) api()?.pick(+b.dataset.tab);
    };
    function paintTabs(list) {
      const tabs = document.getElementById('tabs');
      const rows = Array.isArray(list) ? list : [];
      const sig = rows.map(t => t.i + (t.on ? '*' : '') + t.title).join('\n');
      tabs.hidden = !rows.length;
      if (tabs.dataset.sig === sig) return;
      tabs.dataset.sig = sig;
      tabs.replaceChildren();
      for (const t of rows) {
        const row = document.createElement('div');
        row.className = 'tab' + (t.on ? ' on' : '');
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'label';
        b.dataset.tab = String(t.i);
        b.textContent = t.title || '新分頁';
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'x';
        x.dataset.close = String(t.i);
        x.setAttribute('aria-label', '關閉分頁');
        x.textContent = '×';
        row.appendChild(b);
        row.appendChild(x);
        tabs.appendChild(row);
      }
    }
    if (api()) api().onFrame(d => {
      document.body.classList.toggle('open', d.mode === 'open');
      hit.setAttribute('aria-label', d.mode === 'open' ? '收回瀏覽器' : '打開瀏覽器');
      if (d.name) name.textContent = d.name;
      if (d.jpeg) pic.src = 'data:image/jpeg;base64,' + d.jpeg;
      const back = document.getElementById('goBack');
      back.disabled = !d.canBack;
      const input = document.getElementById('url');
      if (document.activeElement !== input && d.url !== undefined) input.value = d.url || '';
      paintTabs(d.tabs);
      paintEngines(d);
      if (d.dragging) place(d);
      else if (!down?.moved) place(null);
    });
  </script>
</body>
