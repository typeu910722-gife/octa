<!doctype html>
<meta charset="utf-8">
<title>瀏覽器</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #f3ead3; font-family: "Segoe UI", "PingFang TC", sans-serif; overflow: hidden; }
  #card { box-sizing: border-box; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #1c1814; border: 1px solid rgba(212, 175, 106, .75); cursor: grab; position: relative; }
  #hit { all: unset; box-sizing: border-box; display: block; width: 100%; height: 100%; cursor: inherit; position: relative; }
  img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; background: #1c1814; }
  .cap { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .name { background: rgba(28, 24, 20, .86); border-radius: 999px; padding: 3px 8px; font-size: 12px; }
  .bar { display: none; height: 100%; flex-direction: column; background: #1c1814; }
  body.open #card { border-radius: 0; border: 0; cursor: default; }
  body.open #hit, body.open img, body.open .cap { display: none; }
  body.open .bar { display: flex; }
  body.dragging #card { position: absolute; cursor: grabbing; }
  .tools { height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 8px; flex: none; }
  .tabs { height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 8px; overflow-x: auto; flex: none; }
  .tabs[hidden] { display: none; }
  .tabs button, .tool, .back { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid #c4a574; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #e7d3a1; white-space: nowrap; }
  .tabs button.on { background: #c4a574; color: #1c1814; }
  .tool:disabled { opacity: .35; cursor: default; }
  form { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; }
  input { flex: 1; min-width: 0; height: 28px; border-radius: 999px; border: 1px solid rgba(196, 165, 116, .7); background: #12100d; color: #f3ead3; padding: 0 10px; font: inherit; font-size: 12px; }
  .back { flex: none; }
</style>
<body>
  <div id="card">
    <button id="hit" type="button" aria-label="打開瀏覽器">
      <img id="pic" alt="">
      <span class="cap"><span class="name" id="name">瀏覽器</span><span class="name">拖動</span></span>
    </button>
    <div class="bar" id="bar">
      <div class="tabs" id="tabs" hidden></div>
      <div class="tools">
        <button type="button" class="tool" id="goBack">返回上一頁</button>
        <button type="button" class="tool" id="newTab">開啟新分頁</button>
        <form id="go">
          <input id="url" placeholder="https://" autocomplete="off" spellcheck="false" aria-label="網址">
          <button type="submit" class="tool">編輯</button>
        </form>
        <button type="button" class="back" id="collapse">收回</button>
      </div>
    </div>
  </div>
  <script>
    const hit = document.getElementById('hit');
    const card = document.getElementById('card');
    const pic = document.getElementById('pic');
    const name = document.getElementById('name');
    const api = () => window.octaBrowser;
    let down = null;
    function place(d) {
      if (!d || !d.dragging) {
        document.body.classList.remove('dragging');
        card.style.left = card.style.top = card.style.width = card.style.height = '';
        return;
      }
      document.body.classList.add('dragging');
      card.style.left = d.x + 'px';
      card.style.top = d.y + 'px';
      card.style.width = d.w + 'px';
      card.style.height = d.h + 'px';
    }
    function endDrag(moved) {
      down = null;
      if (moved) api()?.dragEnd();
      else if (!document.body.classList.contains('dragging')) api()?.toggle();
    }
    hit.addEventListener('pointerdown', e => {
      if (document.body.classList.contains('open') || e.button !== 0) return;
      down = { sx: e.screenX, sy: e.screenY, moved: false, pid: e.pointerId };
      try { hit.setPointerCapture(e.pointerId); } catch { }
      e.preventDefault();
    });
    hit.addEventListener('pointermove', e => {
      if (!down || e.pointerId !== down.pid) return;
      const dx = e.screenX - down.sx, dy = e.screenY - down.sy;
      if (!down.moved) {
        if (Math.hypot(dx, dy) < 6) return;
        down.moved = true;
        const box = api()?.dragStart();
        place(box ? { dragging: true, ...box } : null);
        if (!box) { down = null; return; }
      }
      down.sx = e.screenX;
      down.sy = e.screenY;
      api()?.dragBy(dx, dy);
    });
    hit.addEventListener('pointerup', e => {
      if (!down || e.pointerId !== down.pid) return;
      const moved = down.moved;
      try { hit.releasePointerCapture(e.pointerId); } catch { }
      endDrag(moved);
    });
    hit.addEventListener('pointercancel', () => { if (down) endDrag(down.moved); });
    window.addEventListener('blur', () => { if (down?.moved) endDrag(true); else down = null; });
    document.getElementById('goBack').onclick = () => api()?.back();
    document.getElementById('newTab').onclick = () => api()?.newTab();
    document.getElementById('collapse').onclick = () => api()?.toggle();
    document.getElementById('go').onsubmit = e => { e.preventDefault(); api()?.go(document.getElementById('url').value); };
    document.getElementById('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) api()?.pick(+b.dataset.tab); };
    function paintTabs(list) {
      const tabs = document.getElementById('tabs');
      const rows = Array.isArray(list) ? list : [];
      const sig = rows.map(t => t.i + (t.on ? '*' : '') + t.title).join('\n');
      tabs.hidden = rows.length < 2;
      if (tabs.dataset.sig === sig) return;
      tabs.dataset.sig = sig;
      tabs.replaceChildren();
      for (const t of rows) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.tab = String(t.i);
        if (t.on) b.className = 'on';
        b.textContent = t.title || '新分頁';
        tabs.appendChild(b);
      }
    }
    if (api()) api().onFrame(d => {
      document.body.classList.toggle('open', d.mode === 'open');
      hit.setAttribute('aria-label', d.mode === 'open' ? '收回瀏覽器' : '打開瀏覽器');
      if (d.name) name.textContent = d.name;
      if (d.jpeg) pic.src = 'data:image/jpeg;base64,' + d.jpeg;
      const back = document.getElementById('goBack');
      back.disabled = !d.canBack;
      const input = document.getElementById('url');
      if (document.activeElement !== input && d.url !== undefined) input.value = d.url || '';
      paintTabs(d.tabs);
      if (d.mode === 'open') place(null);
      else if (d.dragging) place(d);
      else if (!down?.moved) place(null);
    });
  </script>
</body>
