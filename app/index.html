<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- look, text size, density, chat width, sidebar width and accent before first paint (data-theme only when the person picked one) -->
<script>
// 4.14.1 inside the phone's /go page: what this phone chose and has seen (look, language, read messages) comes along to
// this computer's new address in the fragment (#…&p=); only these keys, and only where this address has nothing yet
(function(){try{var h=location.hash,m=/[#&]p=([A-Za-z0-9_-]{1,16000})(&|$)/.exec(h);if(!m||!/[#&]sh=1(&|$)/.test(h)||window.parent===window)return;
var s=m[1].replace(/-/g,'+').replace(/_/g,'/'),b=atob(s+'==='.slice((s.length+3)%4)),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
var o=JSON.parse(new TextDecoder().decode(u)),K=/^(octa_lang|octa_theme|octa_accent|octa_accent_css|octa_fs|octa_density|octa_cw|octa_sidew|octa_chatw|octa_seafx|octa_lowpower|octa_seen_v|ebot_guided|octa_seen|octa_failseen|octa_nag|octa_order|octa_rail|octa_folded|octa_seafold|octa_wsfold|octa_ovf|octa_lseg)$/;for(var k in o)if(K.test(k)&&typeof o[k]==='string'&&o[k].length<=4000&&localStorage.getItem(k)===null)localStorage.setItem(k,o[k])}catch(e){}})();
(function(){try{var d=document.documentElement,L=localStorage,q=new URLSearchParams(location.search).get('theme'),s=localStorage.getItem('octa_theme');var t=/^(light|dark|sea)$/.test(q)?q:s;if(t==='light'||t==='dark')d.setAttribute('data-theme',t);if(t==='sea')d.setAttribute('data-theme',t);if(window.octaDesktop)d.classList.add('desk');
var f=localStorage.getItem('octa_fs');var map={s:.93,m:1,l:1.12,xl:2};var z=map[f];if(z==null){var n=parseFloat(f);if(n>=70&&n<=200)z=n/100}if(z){d.style.setProperty('--fz',z<1?1:z);if(z<1)d.style.zoom=z;var a=z>=1.6?'xl':z>=1.08?'l':z<=.8?'xs':z<=.95?'s':'';a&&d.setAttribute('data-fs',a)}
L.octa_density=='compact'&&d.setAttribute('data-density','compact');(a=L.octa_cw)&&d.setAttribute('data-cw',a);(a=+L.octa_sidew)>=220&&d.style.setProperty('--side-w',a+'px');
if(a=L.octa_accent_css){var e=document.createElement('style');e.id='accentCss';e.textContent=a;document.head.appendChild(e)}}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OCTA">
<meta name="robots" content="noindex,nofollow">
<title>OCTA 奧克塔</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/panels.css">
<link rel="stylesheet" href="/css/avatar.css">
<link rel="stylesheet" href="/css/workpanel.css">
<link rel="stylesheet" href="/css/overview.css">
<link rel="stylesheet" href="/css/prefs.css">
<link rel="stylesheet" href="/css/sea.css">
<link rel="stylesheet" href="/css/seabase.css">
<script src="/i18n-dict.js"></script>
<script src="/i18n-core.js"></script>
</head>
<body>
<div class="boot" id="boot" role="progressbar" aria-label="載入中">
  <img src="/icon.png" alt="" class="boot-logo">
  <div class="boot-name" data-u>OCTA 奧克塔</div>
  <div class="boot-track"><div class="boot-fill" id="bootFill"></div></div>
  <div class="boot-msg"><span id="bootMsg">載入中…</span> <span id="bootPct" data-u>0%</span></div>
</div>

<!-- the phone: pair with the code shown on the computer (the only sign-in OCTA has) -->
<main class="pairing" id="pair" hidden>
  <form class="pair-card" id="pairForm">
    <img src="/icon.png" alt="" class="pair-logo">
    <h1>連接你的電腦</h1>
    <p>打開電腦上的 OCTA，到「設定 → 手機遠端」，輸入那裡顯示的 8 碼配對碼。</p>
    <label class="field"><span>配對碼</span><input id="pairCode" class="code-in" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="12" required placeholder="例如 7K3P9QXA"></label>
    <div class="errmsg" id="pairErr" role="alert"></div>
    <button class="btn big" id="pairGo">連接</button>
    <div class="pair-lang" id="pairLang"></div>
  </form>
</main>

<div class="app" id="app" hidden>
  <div class="seafx-layer" aria-hidden="true"><i></i><i></i><i></i></div>
  <aside class="side" id="side" aria-label="對話">
    <div class="side-hd">
      <div class="brand"><img src="/icon.png" alt="" class="logo"><span class="bname" data-u>OCTA</span><span class="bname2" data-u>奧克塔</span></div>
      <button type="button" class="ib" id="plus" aria-label="新增" title="新增（Alt+N）" data-i="plus"></button>
    </div>
    <div class="side-search">
      <label class="sbox" id="qbox"><span class="si" data-i="search" aria-hidden="true"></span><input id="q" type="search" placeholder="搜尋機器人" autocomplete="off" aria-label="搜尋機器人"><kbd class="kbd" id="qKbd" data-u>Ctrl K</kbd></label>
    </div>
    <!-- 4.10 總覽: the right panel's 總覽 tab (every bot's card) with the whole deep-sea base in view; the base is the main screen -->
    <button type="button" class="ovbtn" id="ovBtn" title="每個機器人在做什麼、今天做了什麼"><span data-i="sea" aria-hidden="true"></span><span>總覽</span><i class="ovbadge" id="ovBadge" hidden></i></button>
    <!-- the phone: the base as a foldable header above the list, and 聊天 | 總覽 -->
    <section class="sea-head" id="seaHead" hidden>
      <button type="button" class="sh-bar" id="seaHeadBar" aria-controls="seaHostP" aria-expanded="true"><span data-i="sea" aria-hidden="true"></span><b>深海基地</b><small id="seaHeadSum"></small><span class="sh-chev" data-i="up" aria-hidden="true"></span></button>
      <div class="sea-host" id="seaHostP"></div>
    </section>
    <div class="lseg" role="tablist" aria-label="清單"><button type="button" role="tab" data-lseg="chat" aria-selected="true">聊天</button><button type="button" role="tab" data-lseg="ov" aria-selected="false"><span>總覽</span><i class="lsbadge" id="lsegBadge" hidden></i></button></div>
    <div class="upd" id="upd" hidden></div>
    <nav class="list" id="list"></nav>
    <div class="lov" id="lov"></div>
    <div class="side-ft">
      <button type="button" class="sfbtn" id="settings"><span data-i="settings" aria-hidden="true"></span><span>設定</span></button>
      <button type="button" class="quota" id="quota" hidden title="AI 剩餘流量"></button>
      <span class="status" id="online" role="status"><i class="sdot"></i><span id="onlineT">電腦離線</span></span>
    </div>
  </aside>

  <section class="pane" id="pane" aria-label="對話內容">
    <!-- 4.10 a computer: the deep-sea base is the stage; the chat floats over it (folds to a bar) -->
    <div class="sea-host" id="seaHostD"></div>
    <p class="stage-hint" id="stageHint" hidden><span data-i="sea" aria-hidden="true"></span><span>點一隻章魚，或從左邊選一個機器人開始對話</span></p>
    <div class="chatmin" id="chatMin" hidden><button type="button" class="cm-go" id="chatMinGo" title="展開對話（Alt+M）"><span class="av" id="cmAv"></span><span class="t"><b id="cmName" data-u></b><small id="cmSub"></small></span><i class="ub" id="cmNew" hidden></i><span class="cm-open"><span data-i="up" aria-hidden="true"></span><span>展開對話</span></span></button></div>
    <div class="chatp" id="chatp">
    <div class="chat-grip" id="chatGrip" role="separator" aria-orientation="vertical" aria-label="調整對話寬度" title="拖曳調整對話寬度（點兩下恢復）" tabindex="0"></div>
    <div class="blank" id="blank"></div>
    <header class="ph" id="ph" hidden>
      <button type="button" class="ib back" id="back" aria-label="返回" data-i="back"></button>
      <button type="button" class="ib" id="railToggle" aria-label="收合對話列表" title="收合對話列表" data-i="sidebar"></button>
      <button type="button" class="who" id="who" aria-label="詳細資料"><span class="av" id="pav"></span><span class="t"><b id="pname" data-u></b><small id="psub"></small></span></button>
      <button type="button" class="cwait" id="cwait" hidden title="在等同事回覆（點一下看工作）"></button>
      <div class="ph-act">
        <button type="button" class="ib" id="browser" aria-label="瀏覽器" title="瀏覽器" data-i="globe"></button>
        <button type="button" class="ib wpbtn" id="panelBtn" aria-label="工作面板" title="工作面板（Ctrl+I）" aria-controls="wp" aria-expanded="false" data-i="panel"><i class="wbadge" id="wpBadge" hidden></i></button>
        <button type="button" class="ib" id="more2" aria-label="更多" title="更多" data-i="more"></button>
        <button type="button" class="ib cmin" id="chatMinBtn" aria-label="收起對話" title="收起對話，看整個基地（Alt+M）" data-i="down"></button>
      </div>
    </header>
    <div class="gmem" id="gmem" hidden aria-label="成員現在在做什麼"></div>
    <div class="offb" id="offb" role="status" hidden></div>
    <div class="followbar" id="followbar" hidden role="status"><span id="followBit"></span><button type="button" id="followGo">過去看看</button><button type="button" class="fx" id="followX" aria-label="關閉提示" data-i="x"></button></div>
    <div class="msgs" id="msgs" aria-live="polite" hidden></div>
    <button type="button" class="jump" id="jump" hidden><span data-i="down" aria-hidden="true"></span><span>新訊息</span></button>
    <div class="failbar" id="failbar" role="status" hidden></div>
    <div class="composer" id="composer" hidden>
      <div class="atpop" id="atpop" hidden></div>
      <div class="chips" id="quick"></div>
      <div class="chips" id="mention"></div>
      <form class="in" id="f">
        <div class="replybar" id="replybar" hidden><span data-i="reply" aria-hidden="true"></span><div class="rq"><b id="replyWho"></b><span id="replyBit" data-u></span></div><button type="button" class="ib sm" id="replyx" aria-label="取消回覆" data-i="x"></button></div>
        <div class="att" id="att"></div>
        <textarea id="msg" rows="1" placeholder="輸入指示…" aria-label="訊息"></textarea>
        <div class="in-bar">
          <button type="button" class="ib" id="clip" aria-label="附加檔案" title="附加檔案" data-i="clip"></button>
          <button type="button" class="ib" id="slashBtn" aria-label="指令" title="指令（輸入 /）" data-i="slash"></button>
          <button type="button" class="ib" id="mic" aria-label="語音輸入" title="語音輸入" data-i="mic" hidden></button>
          <div class="sendto" id="sendTo" hidden></div>
          <button class="send" id="sendBtn" aria-label="送出"><span class="sl">送出</span><span class="sa2" aria-hidden="true" data-i="send"></span><span class="sst" aria-hidden="true" data-i="stop"></span></button>
        </div>
        <input type="file" id="fileIn" multiple accept="image/*,.pdf,.txt,.csv,.md,.json,.xlsx,.docx" hidden>
      </form>
    </div>
    </div>
  </section>

  <!-- the panel on the right (like Claude's side panel): 總覽 · 工作 · 瀏覽器 · 詳細資料. A full page on a phone (no 總覽 there). -->
  <aside class="wp" id="wp" hidden aria-label="工作面板">
    <div class="wp-grip" id="wpGrip" role="separator" aria-orientation="vertical" aria-label="調整工作面板寬度" tabindex="0"></div>
    <header class="wp-hd">
      <button type="button" class="ib back2" data-wclose aria-label="返回" data-i="back"></button>
      <div class="wp-tabs" role="tablist" aria-label="工作面板">
        <button type="button" role="tab" id="wtOv" data-wt="ov" aria-controls="wpOv"><span>總覽</span></button>
        <button type="button" role="tab" id="wtWork" data-wt="work" aria-controls="wpWork"><span>工作</span><i class="tdot" hidden></i></button>
        <button type="button" role="tab" id="wtWeb" data-wt="web" aria-controls="wpWeb"><span>瀏覽器</span><i class="tdot" hidden></i></button>
        <button type="button" role="tab" id="wtInfo" data-wt="info" aria-controls="detail"><span>詳細資料</span></button>
      </div>
      <button type="button" class="ib x" data-wclose aria-label="收起工作面板" title="收起工作面板" data-i="x"></button>
    </header>
    <section class="wp-pane ovp" id="wpOv" role="tabpanel" aria-labelledby="wtOv" hidden>
      <div class="ovwrap" id="ovWrap">
        <div class="ov-bar"><div class="ov-cnt" id="ovSeg" role="tablist" aria-label="篩選"></div>
          <div class="ov-tools"><button type="button" class="ib" id="ovRe" aria-label="重新整理" title="重新整理" data-i="refresh"></button></div></div>
        <div class="ov-body" id="ovBody"><div class="empty fade">載入中…</div></div>
      </div>
    </section>
    <section class="wp-pane wk" id="wpWork" role="tabpanel" aria-labelledby="wtWork" tabindex="-1"></section>
    <section class="wp-pane web" id="wpWeb" role="tabpanel" aria-labelledby="wtWeb" hidden>
      <div class="web-hd" id="webHd"></div>
      <div class="web-stage" id="webStage">
        <div class="web-ph" id="webPh"></div>
        <div class="stage" id="stage" hidden>
          <div class="sthd"><b id="stTitle">瀏覽器</b><span id="stUrl" data-u></span></div>
          <!-- 4.2 手機遙控: address, 上一頁, 重新整理 (usable after 接手) -->
          <form class="scr-bar" id="scrBar" hidden>
            <button type="button" class="ib" id="scrBack" aria-label="上一頁" title="上一頁" data-i="back"></button>
            <input id="scrAddr" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="網址" placeholder="網址或要搜尋的字">
            <button type="button" class="ib" id="scrReload" aria-label="重新整理" title="重新整理" data-i="refresh"></button>
          </form>
          <div class="scr" id="scr" aria-label="電腦上這個機器人的瀏覽器">
            <div class="scr-in" id="scrIn"><img id="stPic" alt="電腦上這個機器人的瀏覽器" draggable="false"></div>
            <span class="scr-tag" id="scrTag" hidden></span>
            <button type="button" class="scr-z" id="scrZoom" hidden aria-label="還原大小">1×</button>
            <span class="scr-hint" id="scrHint">雙指可以放大畫面</span>
          </div>
          <p class="scr-ask" id="scrAsk" hidden>機器人需要你幫忙（例如登入、輸入驗證碼）。按「接手」就能直接在手機上操作。</p>
          <div class="stact"><button type="button" class="btn sm" id="stHand">接手</button><button type="button" class="btn sm ok" id="stGo" hidden>我好了</button></div>
          <p class="hold" id="stHold" hidden>接手中，機器人已停止點擊和打字</p>
        </div>
      </div>
      <!-- 4.2: the phone's keyboard for the bot's page (after 接手) -->
      <div class="web-ctl" id="webCtl" hidden>
        <form class="scr-kb" id="scrKb">
          <input id="scrText" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="在這裡打字，按送出" aria-label="要輸入到網頁的文字">
          <button type="button" class="ib" id="scrEye" aria-label="隱藏文字" title="隱藏文字（輸入密碼時）" aria-pressed="false" data-i="shield"></button>
          <button class="btn sm" id="scrSend">送出</button>
        </form>
        <div class="scr-keys">
          <button type="button" class="ghost sm" data-key="Backspace">⌫ 刪除</button>
          <button type="button" class="ghost sm" data-key="Tab">⇥ 下一格</button>
          <button type="button" class="ghost sm" data-key="Enter">↵ Enter</button>
          <button type="button" class="ghost sm" id="scrPaste">貼上</button>
        </div>
      </div>
      <div class="web-ft" id="webFt"></div>
    </section>
    <section class="wp-pane detail" id="detail" role="tabpanel" aria-labelledby="wtInfo" hidden></section>
  </aside>
</div>
<aside class="askp" id="askp" hidden aria-label="機器人的提問"></aside>
<div class="veil" id="veil" hidden></div>

<script defer src="/js/util.js"></script>
<script defer src="/js/pure.js"></script>
<script defer src="/js/api.js"></script>
<script defer src="/js/avatar.js"></script>
<script defer src="/js/files.js"></script>
<script defer src="/js/sheets.js"></script>
<script defer src="/js/list.js"></script>

<script defer src="/js/chatcards.js"></script>
<script defer src="/js/composer.js"></script>
<script defer src="/js/browser.js"></script>
<script defer src="/js/screen.js"></script>
<script defer src="/js/desktop.js"></script>
<script defer src="/js/routines.js"></script>
<script defer src="/js/bots.js"></script>
<script defer src="/js/panel.js"></script>
<script defer src="/js/settings.js"></script>
<script defer src="/js/wipe.js"></script>
<script defer src="/js/prefs.js"></script>
<script defer src="/js/mail.js"></script>
<script defer src="/js/link.js"></script>
<script defer src="/js/ai.js"></script>
<script defer src="/js/code.js"></script>
<script defer src="/js/overview.js"></script>
<script defer src="/js/seamodel.js"></script>
<script defer src="/js/seascene.js"></script>
<script defer src="/js/seabase.js"></script>
<script defer src="/js/memory-view.js"></script>
<script defer src="/js/skills-ui.js"></script>
<script defer src="/js/onboarding.js"></script>
<script defer src="/js/main.js"></script>
</body>
</html>
