<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><title>OCTA 工作中</title><style>
*{transform-box:view-box}
.leg{transform-origin:var(--o)}
.eye{transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes swayL{50%{transform:rotate(5deg)}}
@keyframes swayR{50%{transform:rotate(-5deg)}}
.bob{animation:bob 3s ease-in-out infinite}
.l1,.l2{animation:swayL 3s ease-in-out infinite}
.r1,.r2{animation:swayR 3s ease-in-out infinite}
.l2,.r2{animation-delay:-1.5s}
.eye{animation:blink 4.5s infinite}

.bob{animation:bob 1.8s ease-in-out infinite}
.l1,.l2,.r1,.r2{animation-duration:1.4s}
@keyframes spark{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.1);opacity:1}}
.star{transform-box:fill-box;transform-origin:center;animation:spark 1s ease-in-out infinite}
</style><g transform="translate(77 110) scale(.7)"><g class="bob"><g fill="none" stroke="#D6B27A" stroke-width="34" stroke-linecap="round"><path class="leg l1" style="--o:160px 300px" d="M 160 300 C 120 350 80 370 64 342 C 54 322 72 302 92 314"/><path class="leg l2" style="--o:210px 340px" d="M 210 340 C 196 410 168 440 140 430 C 120 422 124 398 144 400"/><path class="leg r1" style="--o:352px 300px" d="M 352 300 C 392 350 432 370 448 342 C 458 322 440 302 420 314"/><path class="leg r2" style="--o:302px 340px" d="M 302 340 C 316 410 344 440 372 430 C 392 422 388 398 368 400"/></g><circle cx="256" cy="215" r="140" fill="#D6B27A"/><g class="eyes"><g transform="translate(208 225) rotate(-14)"><path class="eye" d="M 0 -46 Q 27 0 0 46 Q -27 0 0 -46 Z" fill="#1c140a"/></g><g transform="translate(304 225) rotate(14)"><path class="eye" d="M 0 -46 Q 27 0 0 46 Q -27 0 0 -46 Z" fill="#1c140a"/></g></g><g class="star"><path transform="translate(256 410) scale(0.7)" d="M 0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26 Z" fill="#E2A93B"/></g></g></g></svg>