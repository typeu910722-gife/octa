<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><title>OCTA 思考中</title><style>
*{transform-box:view-box}
.leg{transform-origin:var(--o)}
.eye{transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes swayL{50%{transform:rotate(5deg)}}
@keyframes swayR{50%{transform:rotate(-5deg)}}
.bob{animation:bob 3s ease-in-out infinite}
.l1,.l2{animation:swayL 3s ease-in-out infinite}
.r1,.r2{animation:swayR 3s ease-in-out infinite}
.l2,.r2{animation-delay:-1.5s}
.eye{animation:blink 4.5s infinite}

.bob{animation:tilt 3s ease-in-out infinite;transform-origin:256px 300px}
@keyframes tilt{50%{transform:rotate(-4deg) translateY(-6px)}}
@keyframes look{0%,100%{transform:translate(10px,-14px)}50%{transform:translate(-8px,-16px)}}
.eyes{animation:look 3s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.o0{transform-origin:256px 215px;animation:orbit 3.0s linear 0s infinite }
.o1{transform-origin:256px 215px;animation:orbit 4.2s linear -1.6s infinite reverse}
.o2{transform-origin:256px 215px;animation:orbit 5.0s linear -3.1s infinite }
.o3{transform-origin:256px 215px;animation:orbit 3.6s linear -2.4s infinite reverse}
.o4{transform-origin:256px 215px;animation:orbit 6.5s linear -4.7s infinite }
</style><g transform="translate(77 110) scale(.7)"><g class="bob"><g fill="none" stroke="#D6B27A" stroke-width="34" stroke-linecap="round"><path class="leg l1" style="--o:160px 300px" d="M 160 300 C 120 350 80 370 64 342 C 54 322 72 302 92 314"/><path class="leg l2" style="--o:210px 340px" d="M 210 340 C 196 410 168 440 140 430 C 120 422 124 398 144 400"/><path class="leg r1" style="--o:352px 300px" d="M 352 300 C 392 350 432 370 448 342 C 458 322 440 302 420 314"/><path class="leg r2" style="--o:302px 340px" d="M 302 340 C 316 410 344 440 372 430 C 392 422 388 398 368 400"/></g><circle cx="256" cy="215" r="140" fill="#D6B27A"/><g class="eyes"><g transform="translate(208 225) rotate(-14)"><path class="eye" d="M 0 -46 Q 27 0 0 46 Q -27 0 0 -46 Z" fill="#1c140a"/></g><g transform="translate(304 225) rotate(14)"><path class="eye" d="M 0 -46 Q 27 0 0 46 Q -27 0 0 -46 Z" fill="#1c140a"/></g></g><g class="o0"><g class="star"><path transform="translate(256 45) scale(0.6)" d="M 0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26 Z" fill="#E2A93B"/></g></g><g class="o1"><g class="star"><path transform="translate(256 65) scale(0.42)" d="M 0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26 Z" fill="#E2A93B"/></g></g><g class="o2"><g class="star"><path transform="translate(256 27) scale(0.5)" d="M 0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26 Z" fill="#E2A93B"/></g></g><g class="o3"><g class="star"><path transform="translate(256 55) scale(0.36)" d="M 0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26 Z" fill="#E2A93B"/></g></g><g class="o4"><g class="star"><path transform="translate(256 37) scale(0.3)" d="M 0 -26 Q 4 -4 26 0 Q 4 4 0 26 Q -4 4 -26 0 Q -4 -4 0 -26 Z" fill="#E2A93B"/></g></g></g></g></svg>