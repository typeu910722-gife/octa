<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>OCTA 手機遠端</title>

<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<style>
:root{
  --bg:#f6f1e7;--bg2:#efe7d6;--card:#fffdf8;--ink:#1d1a15;--mute:#6d6453;--faint:#9a907c;
  --gold:#9c7a3c;--gold2:#b8924f;--goldbg:rgba(184,146,79,.12);--line:rgba(156,122,60,.22);--line2:rgba(29,26,21,.08);
  --ok:#2f7d4f;--okbg:rgba(47,125,79,.1);--warn:#a55a1f;--warnbg:rgba(165,90,31,.1);
  --btn-ink:#fffaf0;--shadow:0 20px 50px rgba(80,60,20,.12),0 1px 0 rgba(255,255,255,.6) inset;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12110e;--bg2:#1a1814;--card:#1d1a15;--ink:#efe8da;--mute:#a59c88;--faint:#6f6858;
  --gold:#c9a96a;--gold2:#e4cb93;--goldbg:rgba(201,169,106,.13);--line:rgba(201,169,106,.22);--line2:rgba(239,232,218,.08);
  --ok:#7fcf9c;--okbg:rgba(127,207,156,.1);--warn:#f0a868;--warnbg:rgba(240,168,104,.1);
  --btn-ink:#17140f;--shadow:0 24px 60px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-30% -40% auto;height:70vh;background:radial-gradient(closest-side,var(--goldbg),transparent 72%);pointer-events:none}
.wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow);padding:28px 22px 22px;text-align:center}
.brand{margin:0 0 18px;padding-left:.32em;color:var(--gold);font-size:12px;letter-spacing:.32em;font-weight:700}
.hero{position:relative;width:88px;height:88px;margin:4px auto 18px}
.hero img{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.18),0 0 0 1px var(--line)}
.hero .ring{position:absolute;inset:-8px;border-radius:30px;border:2px solid transparent;border-top-color:var(--gold2);border-right-color:var(--gold2);animation:spin 1.1s linear infinite}
.hero .dot{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line2)}
.hero .dot svg{width:18px;height:18px}
.hero.ok .dot{color:var(--ok)} .hero.warn .dot{color:var(--warn)} .hero.idle .dot{color:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero .ring{animation:none;border-color:var(--line)}}
h1{margin:0 0 6px;font-size:20px;line-height:1.45;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.sub{margin:0 auto;max-width:330px;color:var(--mute);font-size:15px;text-wrap:pretty}
.h2{margin:22px 0 0;font-size:15px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px}
.h2::after{content:"";flex:1;height:1px;background:var(--line)}
.host{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:4px 12px;border-radius:99px;background:var(--goldbg);color:var(--gold);font-size:13px;font-weight:600}
.host svg{width:15px;height:15px}
.acts{display:grid;gap:10px;margin-top:22px}
.btn{appearance:none;border:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--btn-ink);box-shadow:0 8px 24px rgba(156,122,60,.25)}
.btn.s{background:transparent;color:var(--gold);border:1px solid var(--line)}
.btn:focus-visible,.lnk:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.btn[disabled]{opacity:.55}
.note{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--bg2);color:var(--mute);font-size:14px;text-align:left}
.note.warn{background:var(--warnbg);color:var(--warn)}
.steps{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;text-align:left}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg2);font-size:14.5px;color:var(--ink)}
.steps li .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--goldbg);color:var(--gold)}
.steps li .k svg{width:19px;height:19px}
.steps li b{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:1px}
.kbd{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:6px;border:1px solid var(--line);font-weight:600;white-space:nowrap}
.kbd svg{width:14px;height:14px;vertical-align:-2px}
.tick{color:var(--faint);font-size:13px;margin-top:12px;min-height:20px}
.foot{margin-top:18px;color:var(--faint);font-size:12.5px;text-align:center}
.lnk{appearance:none;background:none;border:0;padding:4px;font:inherit;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 4.14.1 the app inside /go: the frame fills the screen inside the safe areas; the card covers it while the computer is away */
html.shell,html.shell body{overflow:hidden;overscroll-behavior:none}
html.shell body::before{display:none}
#frame{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:transparent;display:block}
#frame[hidden]{display:none}
html.shell .wrap{position:fixed;inset:0;z-index:2;overflow:auto;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);transition:opacity .25s ease}
html.shell .wrap.gone{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s ease,visibility 0s .25s}
html.shell .wrap.first{background:var(--bg)}
.calm{color:var(--mute);font-size:13px;margin-top:14px}
</style>
</head>

  apple: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.1-4.2zM13.9 4.9c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>',
  android: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 9.5l1.8-3.1a.4.4 0 0 0-.7-.4l-1.8 3.1a11 11 0 0 0-9.8 0L5.3 6a.4.4 0 0 0-.7.4l1.8 3.1A10 10 0 0 0 1.5 17h21a10 10 0 0 0-4.9-7.5zM7 14.2a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm10 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
};

// ---------- storage ----------
let mem = null, storeOk = true;
const S = (() => { try { const s = window.localStorage; s.setItem('octa_go_t', '1'); s.removeItem('octa_go_t'); return s; } catch { storeOk = false; return { getItem: () => mem, setItem: (_, v) => { mem = v; }, removeItem: () => { mem = null; } }; } })();
const RELAY_URL = window.OCTA_RELAY || RELAY;   // tests point this at a local relay
const goBack = location.origin + '/go';

// ---------- what the address bar carried (then gone from it) ----------
const frag = parseFragment(location.hash);
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
let host = loadHost(S);
let fresh = false;
if (frag.host) { host = mergeHost(host, frag.host); saveHost(S, host); fresh = true; }
const web = frag.web || '', retry = frag.retry || '';

// ---------- the screens ----------
const view = document.getElementById('view'), foot = document.getElementById('foot');
const hostName = () => esc(host?.n || W.pc[IDX]);
const hero = (cls, icon, spin) => `<div class="hero ${cls}"><img src="/icon-192.png" alt="">${spin ? '<span class="ring" aria-hidden="true"></span>' : ''}${icon ? `<span class="dot">${IC[icon]}</span>` : ''}</div>`;
const chip = () => host ? `<div class="host">${IC.pc}<span>${hostName()}</span></div>` : '';
function paintFoot() {
  foot.innerHTML = host ? `<span>${t('privacy')}</span><br><button class="lnk" id="forget">${t('forget')}</button>` : `<span>${t('privacy')}</span>`;
  const f = document.getElementById('forget');
  if (f) f.onclick = () => { if (confirm(W.forgetQ[IDX].replace('{name}', host?.n || W.pc[IDX]))) { S.removeItem(STORE_KEY); host = null; stopTimer(); if (shell) { shell.stop(); shell = null; frame.src = 'about:blank'; frame.hidden = true; document.documentElement.classList.remove('shell'); } cover(true); none(); } };
}
function busy(key) {
  view.innerHTML = `${hero('idle', '', true)}<h1>${t(key)}</h1>${chip()}`;
  paintFoot();
}
function none() {
  view.innerHTML = `${hero('idle', 'qr')}<h1>${t('none')}</h1><p class="sub">${t('noneSub')}</p>
    <ol class="steps"><li><span class="k">${IC.pc}</span><span>${t('n1')}</span></li><li><span class="k">${IC.gear}</span><span>${t('n2')}</span></li><li><span class="k">${IC.qr}</span><span>${t('n3')}</span></li></ol>
    ${storeOk ? '' : `<p class="note warn">${t('noStore')}</p>`}`;
  paintFoot();
}
function codeBad() {
  view.innerHTML = `${hero('warn', 'qr')}<h1>${t('codeBad')}</h1><p class="sub">${t('codeBadSub')}</p>${chip()}`;
  paintFoot();
}
let timer = null, left = 0;
const stopTimer = () => { clearInterval(timer); timer = null; };
function down(code) {
  const k = code === 'relay-down' ? 'relay' : code === 'off' ? 'off' : 'down';
  view.innerHTML = `${hero('warn', 'off')}<h1>${t(k)}</h1><p class="sub">${t(k + 'Sub')}</p>${chip()}
    <div class="acts"><button class="btn s" id="retry">${t('retry')}</button></div><p class="tick" id="tick" aria-live="off"></p>`;
  document.getElementById('retry').onclick = () => { stopTimer(); run(); };
  stopTimer(); left = 10;
  const tick = () => { const el = document.getElementById('tick'); if (el) el.textContent = W.retryIn[IDX].replace('{n}', left); if (left-- <= 0) { stopTimer(); run(); } };
  tick(); timer = setInterval(tick, 1000);
  paintFoot();
}
function ready(url, inside) {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(navigator.userAgent);
  const rows = [
    `<li><span class="k">${IC.apple}</span><span><b>${t('ios')}</b>${t('iosHow', { share: `<span class="kbd">${IC.share}</span>` })}</span></li>`,
    `<li><span class="k">${IC.android}</span><span><b>${t('android')}</b>${t('androidHow', { dots: `<span class="kbd">${IC.dots}</span>` })}</span></li>`];
  if (android && !ios) rows.reverse();
  view.innerHTML = `${hero('ok', 'ok')}<h1>${t('ready')}</h1><p class="sub">${t('readySub')}</p>${chip()}
    <h2 class="h2">${t('addHome')}</h2>
    <ol class="steps" style="margin-top:10px">${rows.join('')}</ol>
    ${storeOk ? '' : `<p class="note warn">${t('noStore')}</p>`}
    <div class="acts"><a class="btn p" id="openApp" href="${esc(url)}">${t('go')}</a></div>`;
  paintFoot();
  // 4.14.1: OCTA opens inside this page (so it can come back by itself after the computer restarts)
  if (inside) document.getElementById('openApp').onclick = e => { e.preventDefault(); wrap.classList.remove('first'); shellUp().enter(inside); };
}

// ---------- 4.14.1: OCTA inside this page ----------
// This page stays the one the phone has open; the app runs in the frame at the computer's current address. When the
// computer restarts (an update: a new address) the card covers the frame, the new address is found and put in the
// frame with this phone's token, all by itself. ?direct=1 opens the app the old way (straight at its address).
const wrap = document.querySelector('.wrap'), frame = document.getElementById('frame');
const direct = new URLSearchParams(location.search).has('direct');
const LOOK_KEY = 'octa_go_look';
let look = {}; try { look = JSON.parse(S.getItem(LOOK_KEY) || '{}') || {}; } catch { }
const themeMeta = [...document.querySelectorAll('meta[name="theme-color"]')];
function paintLook() {
  if (!/^(rgb|#)/.test(look.bg || '')) return;
  document.body.style.background = look.bg;
  for (const m of themeMeta) m.setAttribute('content', look.bg);
}
let shell = null, readyTimer = null;
function cover(on) { wrap.classList.toggle('gone', !on); }
function waitView(why) {
  if (why === 'unpaired') {
    view.innerHTML = `${hero('warn', 'qr')}<h1>${t('repair')}</h1><p class="sub">${t('repairSub')}</p>${chip()}
      <ol class="steps"><li><span class="k">${IC.pc}</span><span>${t('n1')}</span></li><li><span class="k">${IC.gear}</span><span>${t('n2')}</span></li><li><span class="k">${IC.qr}</span><span>${t('n3')}</span></li></ol>
      <div class="acts"><button class="btn s" id="haveCode">${t('haveCode')}</button></div>`;
    document.getElementById('haveCode').onclick = () => cover(false);   // the app's own pairing screen is under this card
    return paintFoot();
  }
  const k = { lost: 'back', restart: 'back', update: 'update', quit: 'quit', down: 'down', off: 'off', relay: 'relay' }[why] || 'back';
  const calm = k === 'back' || k === 'update';
  view.innerHTML = `${hero(calm ? 'idle' : 'warn', calm ? '' : 'off', calm || k === 'quit' || k === 'down')}<h1>${t(k)}</h1><p class="sub">${t(k + 'Sub')}</p>${chip()}<p class="calm" id="waited" aria-live="off"></p>`;
  paintFoot();
}
// how long it has been (shown quietly under the card)
setInterval(() => {
  const el = document.getElementById('waited'), st = shell?.state();
  if (!el || !st || st.mode !== 'wait' || !st.since) return;
  const s = Math.round((Date.now() - st.since) / 1000);
  el.textContent = s < 5 ? '' : W.waited[IDX].replace('{n}', s < 60 ? s + 's' : Math.floor(s / 60) + 'm' + String(s % 60).padStart(2, '0') + 's');
}, 1000);
function shellUp() {
  if (shell) return shell;
  document.documentElement.classList.add('shell');
  paintLook();
  shell = createShell({
    host, go: goBack, web, retry, theme: look.theme || '', relay: RELAY_URL,
    save: h => { host = h; saveHost(S, h); },
    visible: () => !document.hidden,
    show({ mode, src, why }) {
      clearTimeout(readyTimer);
      if (mode === 'app') {
        if (src) {
          busy('open'); cover(true);
          frame.hidden = false; frame.src = src;
          // the app says when it is ready; if it never does, show what the frame has anyway
          readyTimer = setTimeout(() => cover(false), 20000);
        } else cover(false);
        return;
      }
      waitView(why); cover(true);
    }
  });
  return shell;
}
addEventListener('message', e => {
  if (!shell) return;
  const d = shellAccept(e, shell.state().url, frame.contentWindow);
  if (!d) return;
  if (d.type === 'title' && typeof d.title === 'string') { document.title = d.title.slice(0, 80) || 'OCTA'; return; }
  if (d.type === 'look') {
    look = { bg: String(d.bg || '').slice(0, 40), theme: /^(light|dark|sea)$/.test(d.theme || '') ? d.theme : '' };
    try { S.setItem(LOOK_KEY, JSON.stringify(look)); } catch { }
    return paintLook();
  }
  if (d.type === 'ready' && typeof d.title === 'string') document.title = d.title.slice(0, 80) || 'OCTA';
  shell.message(d);
  const st = shell.state();
  if (st.mode === 'app' && st.ready) { clearTimeout(readyTimer); cover(false); }
});
const wake = () => { if (shell && !document.hidden) shell.check(); };
document.addEventListener('visibilitychange', wake);
addEventListener('online', wake);
addEventListener('focus', wake);

// ---------- find the host, then open the app there ----------
let running = false;
async function run() {
  if (running) return; running = true; stopTimer();
  try {
    if (!host) return none();
    busy(host.c ? 'pairing' : 'find');
    let where;
    try { where = await locate(host, { relay: RELAY_URL }); }
    catch (e) {
      // signed in already: wait here (quickly at first) and come back by itself, whatever the reason
      if (host.t && !direct) { shellUp().find(host.u || '', e.code === 'restarting' ? e.why : e.code === 'off' ? 'off' : e.code === 'relay-down' ? 'relay' : 'lost'); return; }
      return down(e.code === 'restarting' ? 'down' : e.code);
    }
    if (where.name && where.name !== host.n) host.n = where.name;
    host.u = where.url;
    if (host.c) {
      try { host.t = await pairWith(where.url, host.c); delete host.c; }
      catch (e) { saveHost(S, host); return e.code === 'code' ? codeBad() : down('down'); }
    }
    saveHost(S, host);
    if (!host.t) return none();
    const inside = !direct && await shellOk(where.url) ? where.url : '';
    const url = appUrl(where.url, { t: host.t, web, retry, go: goBack });
    if (fresh) { fresh = false; if (inside) wrap.classList.add('first'); return ready(url, inside); }   // the first time: show how to keep this page on the home screen
    if (inside) return shellUp().enter(inside);
    busy('open');
    location.replace(url);   // an OCTA from before 4.14.1: open it at its address, as before
  } finally { running = false; }
}
// coming back to this tab (the app was on an old address): look again
addEventListener('pageshow', e => { if (e.persisted) { if (shell) shell.check(); else run(); } });
// a QR or notice link opened while this page was already showing: start over with what it carries
addEventListener('hashchange', () => { if (location.hash) location.reload(); });
run();
</script>
</body>
</html>
