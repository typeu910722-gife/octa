name = "ebot"
pages_build_output_dir = "site"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ebot"
database_id = "fa3975d5-b35c-45fd-a28f-96b4abb9264b"

[vars]
TZ_OFFSET_MIN = "480"   # 排程時區（分鐘），台灣 +8 = 480
ALLOW_SIGNUP = "false"  # 4.0：舊雲端已凍結，只留 host/export 讓舊使用者把資料搬回電腦
CANONICAL_HOST = "octa.yzprojecttw.com"     # 主要網址，例如 octa.example.com（留空不轉址）
LEGACY_HOSTS = "bot.yzprojecttw.com,ebot-pqf.pages.dev"       # 要轉到主要網址的舊網址，逗號分隔
DOWNLOAD_URL = "https://github.com/typeu910722-gife/octa/releases/latest/download/OCTA-Setup.exe"   # 首頁的桌面版下載按鈕（留空隱藏）
REPO_URL = "https://github.com/typeu910722-gife/octa"
