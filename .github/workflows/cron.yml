name: Routine timer

# Fires 例行任務 on time (雲端排程) even when no one has OCTA open, and tidies up old data.
# Set the repository variable OCTA_URL if your site is not octa.yzprojecttw.com.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # a failed tick (e.g. the database's daily free quota is used up) is only a warning: the next tick tries again,
      # and it should not send a "Run failed" notice every few minutes
      - run: curl -fsS --max-time 60 "${{ vars.OCTA_URL || 'https://octa.yzprojecttw.com' }}/api/cron" || echo "::warning::這次排程沒有成功（例如雲端資料庫今天的免費額度用完），下一次會再試"
