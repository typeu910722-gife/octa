name: Desktop build

# Builds the Windows installer and publishes it as a GitHub Release.
# Run it from the Actions tab (Run workflow) or push a v* tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build installer
        run: npm run dist
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release notes from changelog
        shell: bash
        run: node -e "const v=require('./package.json').version,c=require('../app/changelog.json').find(x=>x.v===v);require('fs').writeFileSync('notes.md',(c?c.notes.map(n=>'- '+n).join('\n')+'\n\n':'')+'Windows 安裝檔：下載 OCTA-Setup.exe 後執行。第一次執行若出現「Windows 已保護您的電腦」，按「其他資訊 → 仍要執行」。\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: OCTA-Setup-windows
          path: desktop/dist/*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: OCTA ${{ steps.v.outputs.version }}
          make_latest: true
          body_path: desktop/notes.md
          files: |
            desktop/dist/OCTA-Setup.exe
            desktop/dist/OCTA-Setup.exe.blockmap
            desktop/dist/latest.yml
